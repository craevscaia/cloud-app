apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: cloud-lab
    includeSelectors: false
resources:
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - servicemonitor.yaml
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - grafana-dashboards/app-dashboard.yaml
  - grafana-dashboards/logs-dashboard.yaml
